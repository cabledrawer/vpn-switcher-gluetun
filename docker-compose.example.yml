services:
  vpn-switcher:
    image: nginx:1.30-alpine
    container_name: vpn-switcher
    depends_on:
      - gluetun
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8090:80"   # bind to a LAN IP or put a reverse proxy in front
    mem_limit: 64m
    cpus: 0.5
    restart: unless-stopped
